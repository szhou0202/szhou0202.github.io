<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; */
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .page-title {
      /* font-size: 48px; */
      font-weight: 700;
      color: #243b53;
      margin-bottom: 40px;
      text-align: center;
    }

    /* .page-subtitle {
      font-size: 32px;
      font-weight: 700;
      color: #243b53;
      margin-bottom: 40px;
      text-align: center;
    } */

    .gallery {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
      max-width: 100%;
    }

    .thumbnail {
      position: relative;
      width: calc(33.333% - 32px);
      border-radius: 24px;
      /* border: 5px solid #000; */
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .thumbnail .caption {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #243b53;
      font-family: "EB Garamond", Garamond, serif;
      font-size: 28px;
      font-weight: 700;
      text-shadow: 0 0 20px #fff, 0 0 20px #fff, 0 0 30px #fff, 0 0 45px #fff, 0 0 60px #fff;
      pointer-events: none;
    }

    .thumbnail:hover {
      transform: scale(1.06);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    }

    .thumbnail img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 1;
      object-fit: cover;
    }

    /* placeholder styling for slots without an image yet */
    .thumbnail .placeholder {
      width: 100%;
      aspect-ratio: 3 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #d9e2ec, #bcccdc);
      color: #486581;
      font-size: 15px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
